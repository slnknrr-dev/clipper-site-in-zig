<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="300" viewBox="0 0 400 300">
  <style>
    .hot { fill: #e33; stroke: #400; }
    #cool { fill: rgb(40, 120, 220) }
    rect.frame { fill: none; stroke: navy; stroke-width: 3 }
  </style>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="gold"/>
      <stop offset="50%" stop-color="#e05" stop-opacity="0.8"/>
      <stop offset="1" stop-color="teal"/>
    </linearGradient>
    <linearGradient id="lg2" xlink:href="#lg" x1="0" y1="0" x2="0" y2="1"/>
    <radialGradient id="rg" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.35">
      <stop offset="0" stop-color="white"/>
      <stop offset="1" stop-color="darkgreen"/>
    </radialGradient>
    <symbol id="star" viewBox="0 0 100 100">
      <polygon points="50,5 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38" fill-rule="evenodd"/>
    </symbol>
    <g id="dot"><circle r="6"/></g>
  </defs>
  <rect class="frame" x="2" y="2" width="396" height="296" rx="18"/>
  <rect x="20" y="20" width="110" height="80" rx="12" ry="24" fill="url(#lg)"/>
  <ellipse cx="200" cy="60" rx="55" ry="38" fill="url(#rg)" stroke="#333" stroke-width="2"/>
  <path class="hot" stroke-width="4" stroke-linejoin="round" d="M270 20 l50 0 l-25 70 z"/>
  <path id="cool" d="M330,20 h50 v30 a25 25 0 0 1 -50 0 Z" opacity="0.7"/>
  <g transform="translate(20 120) rotate(-8) scale(1.1)">
    <path d="M0 0 C 30 -40, 70 40, 100 0 S 170 -40, 200 0" fill="none" stroke="purple" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 30 Q 50 70 100 30 T 200 30" fill="none" stroke="#0a0" stroke-width="5" stroke-dasharray="14 6 3 6" stroke-linecap="butt"/>
  </g>
  <polyline points="230,130 260,190 290,140 320,200 350,130" fill="none" stroke="#c60" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="10"/>
  <polyline points="230,220 260,280 290,230 320,290 350,220" fill="none" stroke="#06c" stroke-width="10" stroke-linejoin="bevel" stroke-linecap="square"/>
  <use xlink:href="#star" x="20" y="190" width="90" height="90" fill="url(#lg2)"/>
  <use href="#star" x="120" y="200" width="70" height="70" fill="tomato" fill-rule="nonzero"/>
  <path d="M120 200 m0 0" fill="red"/>
  <path fill-rule="evenodd" fill="#456" d="M200 200 h60 v60 h-60 z M215 215 h30 v30 h-30 z"/>
  <use href="#dot" x="380" y="280" fill="crimson"/>
  <line x1="365" y1="150" x2="395" y2="250" stroke="black" stroke-width="3" stroke-dasharray="5,5"/>
  <circle cx="375" cy="100" r="18" fill="none" stroke="hsl(10,10%,10%)" stroke-width="5" stroke-opacity="0.5"/>
</svg>

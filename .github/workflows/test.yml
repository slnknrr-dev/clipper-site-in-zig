# Тесты: модульные и сквозные (zig build test) на Windows — там, где сервер проверен.
# Подробно — DEVOPS_RU_RND.md.

name: test

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Тесты
        run: zig build test --summary all
